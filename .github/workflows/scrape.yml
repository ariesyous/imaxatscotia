name: Scrape IMAX showtimes

on:
  schedule:
    - cron: "30 15 * * *" # ~11:30am ET daily (UTC-4, i.e. EDT; drifts to ~10:30am during EST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: node scripts/scrape.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "Update IMAX showtimes"
          git pull --rebase
          git push
